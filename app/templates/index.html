<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spider Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header>
    <p class="eyebrow">Species Identification System</p>
    <h1>Spider Scanner</h1>
    <p>Upload a photo — identify the species in seconds</p>
  </header>

  <div class="card">
    <div id="drop-zone">
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" />
      <span class="drop-icon">🕷️</span>
      <div class="drop-label">
        <strong>Drop an image here</strong>
        or click to browse — JPEG, PNG, WebP · max 200 MB
      </div>
    </div>

    <div id="preview-wrap">
      <img id="preview-img" src="" alt="Selected spider image" />
      <button id="clear-btn">✕ clear</button>
    </div>

    <div id="error-msg" class="msg error"></div>

    <button id="scan-btn" disabled>Scan Species</button>

    <div id="result">
      <div class="result-divider"></div>
      <div class="result-label">Detected Species</div>
      <div class="result-species" id="result-species">—</div>
      <div class="result-bar-wrap">
        <div class="result-bar-bg">
          <div class="result-bar-fill" id="result-bar"></div>
        </div>
        <div class="result-pct" id="result-pct">—</div>
      </div>
    </div>
  </div>

  <footer>Spider Scanner · 15 species · v0.1.0</footer>

  <script>
    const dropZone   = document.getElementById('drop-zone');
    const fileInput  = document.getElementById('file-input');
    const previewWrap= document.getElementById('preview-wrap');
    const previewImg = document.getElementById('preview-img');
    const clearBtn   = document.getElementById('clear-btn');
    const scanBtn    = document.getElementById('scan-btn');
    const errorMsg   = document.getElementById('error-msg');
    const resultEl   = document.getElementById('result');
    const resultSpecies = document.getElementById('result-species');
    const resultBar  = document.getElementById('result-bar');
    const resultPct  = document.getElementById('result-pct');

    let selectedFile = null;

    // Drag-and-drop styling
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    clearBtn.addEventListener('click', resetState);

    function handleFile(file) {
      hideError();
      hideResult();

      const allowed = ['image/jpeg', 'image/png', 'image/webp'];
      if (!allowed.includes(file.type)) {
        showError('Unsupported file type. Please upload a JPEG, PNG, or WebP image.');
        return;
      }
      if (file.size > 200 * 1024 * 1024) {
        showError('Image exceeds the 200 MB size limit.');
        return;
      }

      selectedFile = file;
      const url = URL.createObjectURL(file);
      previewImg.src = url;
      previewWrap.style.display = 'block';
      scanBtn.disabled = false;
    }

    scanBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      hideError();
      hideResult();
      scanBtn.disabled = true;
      scanBtn.classList.add('loading');
      scanBtn.textContent = 'Scanning';

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const res = await fetch('/predict', { method: 'POST', body: formData });
        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || 'An unexpected error occurred.');
          return;
        }

        showResult(data.species, data.confidence);
      } catch (err) {
        showError('Network error — is the server running?');
      } finally {
        scanBtn.classList.remove('loading');
        scanBtn.textContent = 'Scan Species';
        scanBtn.disabled = false;
      }
    });

    function showResult(species, confidence) {
      resultSpecies.textContent = species;
      resultEl.style.display = 'block';
      // Animate bar after paint
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          resultBar.style.width = confidence + '%';
          resultPct.textContent = confidence + '%';
        });
      });
    }

    function hideResult() {
      resultEl.style.display = 'none';
      resultBar.style.width = '0%';
      resultPct.textContent = '—';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    function resetState() {
      selectedFile = null;
      fileInput.value = '';
      previewImg.src = '';
      previewWrap.style.display = 'none';
      scanBtn.disabled = true;
      hideError();
      hideResult();
    }
  </script>
</body>
</html>
