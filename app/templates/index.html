<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spider Scanner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=DM+Mono:wght@300;400&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0e0e0d;
      --surface:  #161614;
      --border:   #2a2a26;
      --amber:    #c8922a;
      --amber-dim:#7a551a;
      --cream:    #e8e0cc;
      --muted:    #6b6758;
      --danger:   #a03030;
      --success:  #4a7c4e;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--cream);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 3rem 1.5rem 5rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, #1e1a0e 0%, transparent 70%);
    }

    header {
      text-align: center;
      margin-bottom: 3.5rem;
      animation: fadeDown 0.8s ease both;
    }

    header .eyebrow {
      font-size: 0.65rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--amber);
      margin-bottom: 0.75rem;
    }

    header h1 {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 700;
      line-height: 1;
      color: var(--cream);
    }

    header h1 em {
      font-style: italic;
      color: var(--amber);
    }

    header p {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.05em;
    }

    .card {
      width: 100%;
      max-width: 560px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 2.5rem;
      animation: fadeUp 0.9s ease both;
      animation-delay: 0.15s;
    }

    /* Drop zone */
    #drop-zone {
      border: 1px dashed var(--amber-dim);
      border-radius: 3px;
      padding: 3rem 1.5rem;
      text-align: center;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
    }

    #drop-zone:hover,
    #drop-zone.drag-over {
      border-color: var(--amber);
      background: rgba(200, 146, 42, 0.04);
    }

    #drop-zone input[type="file"] {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .drop-icon {
      font-size: 2.5rem;
      margin-bottom: 1rem;
      display: block;
      filter: grayscale(0.3);
    }

    .drop-label {
      font-size: 0.75rem;
      color: var(--muted);
      line-height: 1.8;
    }

    .drop-label strong {
      display: block;
      color: var(--cream);
      font-size: 0.85rem;
      margin-bottom: 0.25rem;
    }

    /* Preview */
    #preview-wrap {
      display: none;
      margin-top: 1.5rem;
      position: relative;
    }

    #preview-wrap img {
      width: 100%;
      max-height: 300px;
      object-fit: cover;
      border-radius: 3px;
      display: block;
      border: 1px solid var(--border);
    }

    #clear-btn {
      position: absolute;
      top: 0.5rem;
      right: 0.5rem;
      background: rgba(14,14,13,0.85);
      border: 1px solid var(--border);
      color: var(--muted);
      font-family: 'DM Mono', monospace;
      font-size: 0.7rem;
      padding: 0.25rem 0.6rem;
      cursor: pointer;
      border-radius: 2px;
      transition: color 0.15s, border-color 0.15s;
    }
    #clear-btn:hover { color: var(--cream); border-color: var(--amber); }

    /* Submit button */
    #scan-btn {
      margin-top: 1.5rem;
      width: 100%;
      padding: 0.9rem;
      background: var(--amber);
      color: #0e0e0d;
      border: none;
      border-radius: 3px;
      font-family: 'DM Mono', monospace;
      font-size: 0.8rem;
      font-weight: 400;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }
    #scan-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    #scan-btn:not(:disabled):hover { opacity: 0.88; transform: translateY(-1px); }
    #scan-btn:not(:disabled):active { transform: translateY(0); }

    /* Result */
    #result {
      margin-top: 2rem;
      display: none;
      animation: fadeUp 0.5s ease both;
    }

    .result-label {
      font-size: 0.6rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.4rem;
    }

    .result-species {
      font-family: 'Playfair Display', serif;
      font-style: italic;
      font-size: 1.7rem;
      color: var(--amber);
      line-height: 1.2;
    }

    .result-bar-wrap {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .result-bar-bg {
      flex: 1;
      height: 3px;
      background: var(--border);
      border-radius: 2px;
      overflow: hidden;
    }

    .result-bar-fill {
      height: 100%;
      background: var(--amber);
      border-radius: 2px;
      transition: width 0.8s cubic-bezier(0.25, 1, 0.5, 1);
      width: 0%;
    }

    .result-pct {
      font-size: 0.75rem;
      color: var(--cream);
      min-width: 3.5rem;
      text-align: right;
    }

    .result-divider {
      height: 1px;
      background: var(--border);
      margin: 1.5rem 0;
    }

    /* Error / status */
    .msg {
      margin-top: 1rem;
      font-size: 0.72rem;
      padding: 0.75rem 1rem;
      border-radius: 2px;
      border-left: 2px solid;
      display: none;
    }
    .msg.error  { color: #e07070; border-color: var(--danger); background: rgba(160,48,48,0.08); }
    .msg.info   { color: var(--muted); border-color: var(--border); }

    /* Spinner */
    #scan-btn.loading::after {
      content: '';
      display: inline-block;
      width: 0.8em;
      height: 0.8em;
      border: 2px solid #0e0e0d;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-left: 0.6rem;
      vertical-align: middle;
    }

    footer {
      margin-top: 4rem;
      font-size: 0.6rem;
      color: var(--muted);
      letter-spacing: 0.1em;
      text-align: center;
      animation: fadeUp 1s ease both;
      animation-delay: 0.3s;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <header>
    <p class="eyebrow">Species Identification System</p>
    <h1>Spider <em>Scanner</em></h1>
    <p>Upload a photo — identify the species in seconds</p>
  </header>

  <div class="card">
    <div id="drop-zone">
      <input type="file" id="file-input" accept="image/jpeg,image/png,image/webp" />
      <span class="drop-icon">🕷️</span>
      <div class="drop-label">
        <strong>Drop an image here</strong>
        or click to browse — JPEG, PNG, WebP · max 200 MB
      </div>
    </div>

    <div id="preview-wrap">
      <img id="preview-img" src="" alt="Selected spider image" />
      <button id="clear-btn">✕ clear</button>
    </div>

    <div id="error-msg" class="msg error"></div>

    <button id="scan-btn" disabled>Scan Species</button>

    <div id="result">
      <div class="result-divider"></div>
      <div class="result-label">Detected Species</div>
      <div class="result-species" id="result-species">—</div>
      <div class="result-bar-wrap">
        <div class="result-bar-bg">
          <div class="result-bar-fill" id="result-bar"></div>
        </div>
        <div class="result-pct" id="result-pct">—</div>
      </div>
    </div>
  </div>

  <footer>Spider Scanner · 15 species · v0.1.0</footer>

  <script>
    const dropZone   = document.getElementById('drop-zone');
    const fileInput  = document.getElementById('file-input');
    const previewWrap= document.getElementById('preview-wrap');
    const previewImg = document.getElementById('preview-img');
    const clearBtn   = document.getElementById('clear-btn');
    const scanBtn    = document.getElementById('scan-btn');
    const errorMsg   = document.getElementById('error-msg');
    const resultEl   = document.getElementById('result');
    const resultSpecies = document.getElementById('result-species');
    const resultBar  = document.getElementById('result-bar');
    const resultPct  = document.getElementById('result-pct');

    let selectedFile = null;

    // Drag-and-drop styling
    dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
    dropZone.addEventListener('drop', e => {
      e.preventDefault();
      dropZone.classList.remove('drag-over');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    clearBtn.addEventListener('click', resetState);

    function handleFile(file) {
      hideError();
      hideResult();

      const allowed = ['image/jpeg', 'image/png', 'image/webp'];
      if (!allowed.includes(file.type)) {
        showError('Unsupported file type. Please upload a JPEG, PNG, or WebP image.');
        return;
      }
      if (file.size > 200 * 1024 * 1024) {
        showError('Image exceeds the 200 MB size limit.');
        return;
      }

      selectedFile = file;
      const url = URL.createObjectURL(file);
      previewImg.src = url;
      previewWrap.style.display = 'block';
      scanBtn.disabled = false;
    }

    scanBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      hideError();
      hideResult();
      scanBtn.disabled = true;
      scanBtn.classList.add('loading');
      scanBtn.textContent = 'Scanning';

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const res = await fetch('/predict', { method: 'POST', body: formData });
        const data = await res.json();

        if (!res.ok) {
          showError(data.detail || 'An unexpected error occurred.');
          return;
        }

        showResult(data.species, data.confidence);
      } catch (err) {
        showError('Network error — is the server running?');
      } finally {
        scanBtn.classList.remove('loading');
        scanBtn.textContent = 'Scan Species';
        scanBtn.disabled = false;
      }
    });

    function showResult(species, confidence) {
      resultSpecies.textContent = species;
      resultEl.style.display = 'block';
      // Animate bar after paint
      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          resultBar.style.width = confidence + '%';
          resultPct.textContent = confidence + '%';
        });
      });
    }

    function hideResult() {
      resultEl.style.display = 'none';
      resultBar.style.width = '0%';
      resultPct.textContent = '—';
    }

    function showError(msg) {
      errorMsg.textContent = msg;
      errorMsg.style.display = 'block';
    }

    function hideError() {
      errorMsg.style.display = 'none';
    }

    function resetState() {
      selectedFile = null;
      fileInput.value = '';
      previewImg.src = '';
      previewWrap.style.display = 'none';
      scanBtn.disabled = true;
      hideError();
      hideResult();
    }
  </script>
</body>
</html>
